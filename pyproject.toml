[project]
name = "personal-agent"
version = "0.1.0"
description = "Terminal LLM agent that runs every task on one configured Provider/model pair."
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.26.0",
    "litellm>=1.102.0",
    "mcp>=2,<3",
    "prompt-toolkit>=3.0.53",
    "PyYAML>=6.0.2",
    "PyJWT[crypto]>=2.15.1",
    "rich>=15.0.0",
]

[project.scripts]
personal-agent = "personal_agent.__main__:cli"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_agent"]
